<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SEC Unified Enterprise</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/idb@7/build/umd.js"></script>

    <!-- Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151f32', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Segoe UI', 'Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .dark .glass { background: rgba(15, 23, 42, 0.9); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        
        /* Config Table Styles */
        .cfg-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 10px; }
        .cfg-table th { background: #f1f5f9; text-align: left; padding: 6px; border-bottom: 2px solid #e2e8f0; color: #475569; font-weight: 700; text-transform: uppercase; }
        .dark .cfg-table th { background: #1e293b; border-color: #334155; color: #94a3b8; }
        .cfg-table td { padding: 4px; border-bottom: 1px solid #f1f5f9; }
        .dark .cfg-table td { border-color: #334155; }
        .cfg-input { width: 100%; padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; background: transparent; }
        .dark .cfg-input { border-color: #475569; color: white; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col">

    <!-- APP LOCK OVERLAY -->
    <div id="app-lock" class="fixed inset-0 z-[60] bg-slate-900 flex flex-col items-center justify-center p-4 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center">
            <div class="mb-6 text-indigo-500 flex justify-center"><i data-lucide="lock" width="48" height="48"></i></div>
            <h2 class="text-2xl font-bold mb-2 dark:text-white">Security Check</h2>
            <p class="text-slate-500 text-sm mb-6">Enter your 4-digit PIN to access.</p>
            <div class="flex justify-center gap-3 mb-6" id="pin-container">
                <input type="password" maxlength="1" class="pin-digit w-12 h-14 border-2 rounded-xl text-center text-2xl font-bold bg-slate-50 dark:bg-slate-700 dark:border-slate-600 focus:border-indigo-500 outline-none transition dark:text-white" data-idx="0">
                <input type="password" maxlength="1" class="pin-digit w-12 h-14 border-2 rounded-xl text-center text-2xl font-bold bg-slate-50 dark:bg-slate-700 dark:border-slate-600 focus:border-indigo-500 outline-none transition dark:text-white" data-idx="1">
                <input type="password" maxlength="1" class="pin-digit w-12 h-14 border-2 rounded-xl text-center text-2xl font-bold bg-slate-50 dark:bg-slate-700 dark:border-slate-600 focus:border-indigo-500 outline-none transition dark:text-white" data-idx="2">
                <input type="password" maxlength="1" class="pin-digit w-12 h-14 border-2 rounded-xl text-center text-2xl font-bold bg-slate-50 dark:bg-slate-700 dark:border-slate-600 focus:border-indigo-500 outline-none transition dark:text-white" data-idx="3">
            </div>
            <p id="lock-msg" class="text-xs text-red-500 font-bold h-4"></p>
        </div>
    </div>

    <!-- MAIN APP STRUCTURE -->
    <div id="app-content" class="hidden flex-1 flex flex-col max-w-xl mx-auto w-full shadow-2xl border-x border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 relative">
        
        <!-- Header -->
        <header class="sticky top-0 z-40 glass border-b border-slate-100 dark:border-slate-800 px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-200 dark:shadow-none">
                    <span class="font-bold text-lg">S</span>
                </div>
                <div>
                    <h1 class="font-bold text-sm leading-none dark:text-white">SEC Unified</h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Enterprise v1.5</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="app.toggleTheme()" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800"><i data-lucide="moon" id="theme-icon"></i></button>
                <button onclick="app.gemini.toggle()" class="p-2 rounded-lg text-indigo-500 bg-indigo-50 dark:bg-indigo-900/30"><i data-lucide="sparkles"></i></button>
            </div>
        </header>

        <!-- Views Container -->
        <main class="flex-1 overflow-y-auto pb-24 p-4 relative" id="main-view">
            <!-- Dynamic Content Injected Here -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="fixed bottom-0 w-full max-w-xl glass border-t border-slate-200 dark:border-slate-800 z-50 pb-safe">
            <div class="flex justify-around p-2">
                <button onclick="app.nav('tracker')" class="nav-btn flex flex-col items-center p-2 rounded-xl text-indigo-600" data-target="tracker">
                    <i data-lucide="bar-chart-2" width="20"></i><span class="text-[10px] font-bold mt-1">Tracker</span>
                </button>
                <button onclick="app.nav('incentive')" class="nav-btn flex flex-col items-center p-2 rounded-xl text-slate-400" data-target="incentive">
                    <i data-lucide="calculator" width="20"></i><span class="text-[10px] font-bold mt-1">Incentive</span>
                </button>
                <button onclick="app.nav('locker')" class="nav-btn flex flex-col items-center p-2 rounded-xl text-slate-400" data-target="locker">
                    <i data-lucide="folder" width="20"></i><span class="text-[10px] font-bold mt-1">Locker</span>
                </button>
                <button onclick="app.nav('settings')" class="nav-btn flex flex-col items-center p-2 rounded-xl text-slate-400" data-target="settings">
                    <i data-lucide="user" width="20"></i><span class="text-[10px] font-bold mt-1">Profile</span>
                </button>
            </div>
        </nav>

        <!-- Config Modal (Incentive) -->
        <div id="cfg-modal" class="fixed inset-0 z-[55] bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-800 w-full max-w-lg rounded-2xl shadow-2xl flex flex-col max-h-[85vh]">
                <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                    <h3 class="font-bold text-lg dark:text-white">Incentive Config</h3>
                    <button onclick="document.getElementById('cfg-modal').classList.add('hidden')"><i data-lucide="x" class="text-slate-400"></i></button>
                </div>
                <div class="p-2 border-b border-slate-200 dark:border-slate-700 overflow-x-auto flex gap-2" id="cfg-tabs"></div>
                <div id="cfg-content" class="p-4 overflow-y-auto flex-1 dark:text-slate-200"></div>
                <div class="p-4 border-t border-slate-200 dark:border-slate-700 flex justify-end gap-2 bg-slate-50 dark:bg-slate-800/50 rounded-b-2xl">
                    <button onclick="app.incentive.resetCfg()" class="px-4 py-2 text-xs font-bold text-red-600 bg-red-50 dark:bg-red-900/20 rounded-lg">Reset Default</button>
                    <button onclick="app.incentive.saveCfg()" class="px-4 py-2 text-xs font-bold text-white bg-indigo-600 rounded-lg">Save Changes</button>
                </div>
            </div>
        </div>

        <!-- File Viewer Modal -->
        <div id="file-modal" class="fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm hidden flex flex-col items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-800 w-full max-w-4xl h-[90vh] rounded-2xl shadow-2xl flex flex-col relative">
                 <button onclick="document.getElementById('file-modal').classList.add('hidden')" class="absolute top-4 right-4 z-10 bg-black/50 text-white p-2 rounded-full hover:bg-black/70"><i data-lucide="x"></i></button>
                 <div id="file-viewer-content" class="flex-1 w-full h-full p-2 bg-slate-100 dark:bg-slate-900 rounded-2xl overflow-auto flex items-center justify-center"></div>
            </div>
        </div>

        <!-- Gemini Overlay -->
        <div id="gemini-overlay" class="fixed inset-x-0 bottom-0 z-[55] pointer-events-none flex justify-center translate-y-full transition-transform duration-300">
            <div class="pointer-events-auto w-full max-w-xl bg-white dark:bg-slate-800 rounded-t-3xl shadow-2xl border-t border-slate-200 dark:border-slate-700 h-[500px] flex flex-col">
                <div class="p-4 bg-indigo-600 rounded-t-3xl text-white flex justify-between items-center">
                    <div class="flex items-center gap-2"><i data-lucide="bot"></i> <span class="font-bold">AI Assistant</span></div>
                    <button onclick="app.gemini.toggle()" class="hover:bg-white/20 p-1 rounded"><i data-lucide="x"></i></button>
                </div>
                <div id="gemini-chat" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50 dark:bg-slate-900/50">
                    <div class="flex gap-2"><div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center shrink-0"><i data-lucide="bot" width="16"></i></div><div class="bg-white dark:bg-slate-800 p-3 rounded-2xl rounded-tl-none shadow-sm text-sm border dark:border-slate-700 dark:text-white">Hello! I can help you understand how to use this app.</div></div>
                </div>
                <div class="p-3 bg-white dark:bg-slate-800 border-t dark:border-slate-700">
                    <form onsubmit="app.gemini.send(event)" class="flex gap-2">
                        <input id="gemini-input" type="text" placeholder="Ask about features..." class="flex-1 bg-slate-100 dark:bg-slate-900 dark:text-white rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button type="submit" class="bg-indigo-600 text-white p-2 rounded-xl"><i data-lucide="send" width="18"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN SCRIPT -->
    <script>
        // --- CONSTANTS ---
        const INCENTIVE_DEFAULTS = {
            sp: { slabs: [{min: 100000, rate: 700, label: ">= 100k"}, {min: 70000, rate: 600, label: "70k - 100k"}, {min: 40000, rate: 500, label: "40k - 70k"}, {min: 30000, rate: 300, label: "30k - 40k"}, {min: 20000, rate: 200, label: "20k - 30k"}, {min: 15000, rate: 100, label: "15k - 20k"}, {min: 10000, rate: 75, label: "10k - 15k"}, {min: 0, rate: 25, label: "< 10k"}], gates: { std: [{min: 40, p: 1.0}, {min: 35, p: 0.75}, {min: 30, p: 0.6}], sis: [{min: 40, p: 1.0}, {min: 35, p: 1.0}, {min: 30, p: 0.75}, {min: 25, p: 0.5}] }, fm_mult: 0.5, target_thresh: 0.8 },
            tb: { slabs: [{min:70000,rate:800,label:">= 70k"},{min:40000,rate:600,label:"40k - 70k"},{min:30000,rate:500,label:"30k - 40k"},{min:20000,rate:300,label:"20k - 30k"},{min:15000,rate:200,label:"15k - 20k"},{min:10000,rate:100,label:"10k - 15k"}], focus: [{name:"S11 Ultra", rate:1500, keys:"s11 ultra"},{name:"S11/S10+/FE+", rate:1000, keys:"s11,s10+,fe+"},{name:"S10 Lite", rate:750, keys:"s10 lite"},{name:"A11 Plus", rate:400, keys:"a11"}] },
            wr: [{name:"Watch Ultra / 8 Cls / 8", rate:1200, keys:"ultra,classic,watch8,watch 8"},{name:"Other Watches", rate:800, keys:"watch"},{name:"Buds3 Pro", rate:600, keys:"buds3 pro"},{name:"Buds3 / FE", rate:500, keys:"buds3,buds fe"},{name:"Other Buds", rate:400, keys:"buds"},{name:"Galaxy Ring", rate:0, keys:"ring"}],
            cp: { slabs: [{min:100000,rate:400,label:"> 1L"},{min:70000,rate:350,label:"70k - 1L"},{min:40000,rate:300,label:"40k - 70k"},{min:30000,rate:200,label:"30k - 40k"},{min:20000,rate:120,label:"20k - 30k"},{min:10000,rate:100,label:"10k - 20k"},{min:0,rate:50,label:"< 10k"}], kickers: { ff7:{l:400,h:600}, s25:{l:300,h:500} } },
            npc: [{name:"GB5 Pro / 360", rate:3000}, {name:"GB5 360 / GB4 Pro", rate:2500}, {name:"GB5 / GB3 360", rate:1750}, {name:"GB4 Edge / Go", rate:1250}, {name:"Other", rate:1000}],
            bun: { std: [{name:"Wr+Hr", rate:750}, {name:"Wearable", rate:400}, {name:"Hearable", rate:250}], excl: [{name:"Wr+Hr+Acc", rate:1000}, {name:"Wr+Hr", rate:750}, {name:"Wearable", rate:400}, {name:"Hearable", rate:250}, {name:"Acc", rate:100}] },
            acc: [{min:4, rate:3000}, {min:3, rate:2000}, {min:2, rate:1000}, {min:1, rate:500}],
            caps: { global:75000, tb:20000, npc:50000, bun:10000 }
        };

        const app = {
            view: 'tracker',
            trackerSubView: 'entry',
            trackerReportMode: 'volume', // 'volume' or 'value'
            data: {
                sales: JSON.parse(localStorage.getItem('sec_sales_v1') || '{}'),
                trackerDate: new Date().toISOString().split('T')[0],
                profile: JSON.parse(localStorage.getItem('sec_profile_v1') || '{"name":"","code":"","outlet":""}'),
                pin: localStorage.getItem('sec_pin') || '1234',
                theme: localStorage.getItem('sec_theme') || 'light',
                queue: [],
                geminiKey: localStorage.getItem('sec_gemini_key') || '',
                incConfig: JSON.parse(localStorage.getItem('sec_inc_cfg') || JSON.stringify(INCENTIVE_DEFAULTS)),
                incRows: { sp: [], tb: [], wr: [], cp: [], npc: [] },
                incMeta: { k_ff7:0, t_ff7:'low', k_s25:0, t_s25:'low', accVal:0, accBase:0, target:50, channel:'standard', status:'existing' }
            },
            init: () => {
                app.applyTheme();
                app.lock.init();
                app.locker.initDB();
                if(app.data.incRows.sp.length===0) { ['sp','tb','wr'].forEach(k => app.incentive.addRow(k)); }
                lucide.createIcons();
            },
            applyTheme: () => {
                const isDark = app.data.theme === 'dark';
                document.documentElement.classList.toggle('dark', isDark);
                const icon = document.getElementById('theme-icon');
                if(icon) icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
                lucide.createIcons();
            },
            toggleTheme: () => {
                app.data.theme = app.data.theme === 'dark' ? 'light' : 'dark';
                localStorage.setItem('sec_theme', app.data.theme);
                app.applyTheme();
            },
            nav: (target) => {
                app.view = target;
                document.querySelectorAll('.nav-btn').forEach(b => {
                    const active = b.dataset.target === target;
                    b.classList.toggle('text-indigo-600', active);
                    b.classList.toggle('text-slate-400', !active);
                });
                app.render();
            },
            render: () => {
                const main = document.getElementById('main-view');
                if(app.view === 'tracker') app.tracker.render(main);
                else if(app.view === 'incentive') app.incentive.render(main);
                else if(app.view === 'locker') app.locker.render(main);
                else if(app.view === 'settings') app.settings.render(main);
                lucide.createIcons();
            },

            // --- LOCK ---
            lock: {
                init: () => {
                    const inputs = document.querySelectorAll('.pin-digit');
                    inputs.forEach((inp, idx) => {
                        inp.addEventListener('input', (e) => {
                            if(e.target.value.length === 1) {
                                if(idx < 3) inputs[idx+1].focus();
                                else app.lock.check();
                            }
                        });
                        inp.addEventListener('keydown', (e) => {
                            if(e.key === 'Backspace' && !e.target.value && idx > 0) inputs[idx-1].focus();
                        });
                    });
                    inputs[0].focus();
                },
                check: () => {
                    const inputs = Array.from(document.querySelectorAll('.pin-digit'));
                    const entered = inputs.map(i => i.value).join('');
                    if(entered === app.data.pin) {
                        document.getElementById('app-lock').classList.add('hidden'); // Fix: actually hide it
                        document.getElementById('app-lock').style.display = 'none'; // Double down
                        document.getElementById('app-content').classList.remove('hidden');
                        app.render();
                    } else {
                        document.getElementById('lock-msg').innerText = "Incorrect PIN";
                        inputs.forEach(i => i.value = '');
                        inputs[0].focus();
                    }
                }
            },

            // --- TRACKER ---
            tracker: {
                brands: [
                    {k:'samsung', l:'Samsung', c:'bg-blue-500'}, {k:'iphone', l:'Apple', c:'bg-slate-600'},
                    {k:'oppo', l:'Oppo', c:'bg-emerald-500'}, {k:'vivo', l:'Vivo', c:'bg-cyan-500'},
                    {k:'realme', l:'Realme', c:'bg-yellow-500'}, {k:'mi', l:'Xiaomi', c:'bg-orange-500'},
                    {k:'moto', l:'Moto', c:'bg-indigo-500'}, {k:'other', l:'Others', c:'bg-gray-400'}
                ],
                setSubView: (v) => { app.trackerSubView = v; app.render(); },
                setReportMode: (m) => { app.trackerReportMode = m; app.render(); },
                
                render: (el) => {
                    const date = app.data.trackerDate;
                    const entry = app.data.sales[date] || { models: '' };
                    
                    let content = '';
                    
                    if(app.trackerSubView === 'entry') {
                        content = `
                            <div class="fade-in space-y-6">
                                <!-- Date Header -->
                                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm flex justify-between items-center border border-slate-100 dark:border-slate-700">
                                    <div class="flex items-center gap-3">
                                        <div class="bg-indigo-50 dark:bg-indigo-900/50 p-2 rounded-lg text-indigo-600"><i data-lucide="calendar"></i></div>
                                        <input type="date" id="track-date" value="${date}" class="bg-transparent font-bold dark:text-white" onchange="app.tracker.dateChange(this.value)">
                                    </div>
                                    <button onclick="app.tracker.clearToday()" class="text-xs font-bold text-red-500 bg-red-50 dark:bg-red-900/20 px-3 py-2 rounded-lg">Clear</button>
                                </div>

                                <!-- Add Card -->
                                <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-lg border border-slate-100 dark:border-slate-700 relative overflow-hidden">
                                    <div class="absolute top-0 left-0 w-full h-1 bg-indigo-500"></div>
                                    <h3 class="font-bold mb-4 flex items-center gap-2 dark:text-white"><i data-lucide="plus-circle"></i> Add Sale</h3>
                                    <div class="space-y-3">
                                        <select id="t-brand" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-700 dark:text-white font-bold text-sm border-none focus:ring-2 focus:ring-indigo-500">
                                            <option value="">Select Brand</option>
                                            ${app.tracker.brands.map(b => `<option value="${b.k}">${b.l}</option>`).join('')}
                                        </select>
                                        <div class="grid grid-cols-3 gap-3">
                                            <input id="t-model" placeholder="Model (e.g. A36 2 units)" class="col-span-2 p-3 rounded-xl bg-slate-50 dark:bg-slate-700 dark:text-white font-bold text-sm border-none focus:ring-2 focus:ring-indigo-500">
                                            <input id="t-qty" type="number" value="1" class="p-3 rounded-xl bg-slate-50 dark:bg-slate-700 dark:text-white font-bold text-sm text-center border-none focus:ring-2 focus:ring-indigo-500">
                                        </div>
                                        <div class="grid grid-cols-3 gap-3">
                                            <input id="t-variant" placeholder="Variant (e.g. 8/128)" class="col-span-2 p-3 rounded-xl bg-slate-50 dark:bg-slate-700 dark:text-white font-bold text-sm border-none focus:ring-2 focus:ring-indigo-500">
                                            <input id="t-price" type="number" placeholder="Price (Unit)" class="col-span-1 p-3 rounded-xl bg-slate-50 dark:bg-slate-700 dark:text-white font-bold text-sm border-none focus:ring-2 focus:ring-indigo-500">
                                        </div>
                                        <button onclick="app.tracker.add()" class="w-full bg-slate-900 dark:bg-indigo-600 text-white py-3 rounded-xl font-bold mt-2 hover:opacity-90 transition">Add to Queue</button>
                                    </div>
                                </div>

                                <!-- Queue -->
                                ${app.data.queue.length > 0 ? `
                                <div class="bg-slate-800 rounded-3xl p-5 text-white shadow-xl">
                                    <div class="flex justify-between items-center mb-4 border-b border-slate-600 pb-3">
                                        <h4 class="font-bold flex items-center gap-2"><i data-lucide="shopping-cart"></i> Queue (${app.data.queue.length})</h4>
                                    </div>
                                    <div class="space-y-3 mb-4 max-h-48 overflow-y-auto">
                                        ${app.data.queue.map((item, i) => `
                                            <div class="flex justify-between items-center bg-white/10 p-3 rounded-xl">
                                                <div><div class="font-bold text-sm">${item.brand} ${item.model} ${item.variant}</div><div class="text-xs text-slate-400">${item.qty} x ${item.price}</div></div>
                                                <div class="flex items-center gap-3"><span class="font-bold text-emerald-400">${item.total}</span><button onclick="app.tracker.delQ(${i})"><i data-lucide="trash-2" class="text-red-400 w-4"></i></button></div>
                                            </div>
                                        `).join('')}
                                    </div>
                                    <button onclick="app.tracker.save()" class="w-full py-3 bg-emerald-500 rounded-xl font-bold text-sm shadow-lg shadow-emerald-900/20">Confirm & Save</button>
                                </div>` : ''}

                                <!-- Quick Log View -->
                                ${entry.models ? `<div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-100 dark:border-slate-700"><h4 class="text-xs font-bold text-slate-400 uppercase mb-2">Logs for ${date}</h4><div class="text-xs font-mono text-slate-600 dark:text-slate-400 whitespace-pre-wrap pl-2 border-l-2 border-slate-200">${entry.models}</div></div>` : ''}
                            </div>
                        `;
                    } else if (app.trackerSubView === 'report') {
                        const stats = app.tracker.getStats();
                        const isVol = app.trackerReportMode === 'volume';
                        
                        content = `
                            <div class="fade-in space-y-6">
                                <!-- Mode Toggle -->
                                <div class="bg-white dark:bg-slate-800 p-1.5 rounded-2xl border border-slate-200 dark:border-slate-700 flex shadow-sm">

                add: () => {
                    const b = document.getElementById('t-brand').value;
                    const m = document.getElementById('t-model').value;
                    let q = parseInt(document.getElementById('t-qty').value) || 1;
                    const p = parseInt(document.getElementById('t-price').value) || 0;
                    const v = document.getElementById('t-variant').value || "";
                    
                    if(!b || !m) return alert("Please select Brand and Model");

                    // VOLUME PARSING LOGIC: "A36 2 units" -> qty=2
                    const match = m.match(/(\d+)\s*(?:units?|pcs?)/i);
                    if(match) {
                        q = parseInt(match[1]);
                    }
                    
                    app.data.queue.push({ brand: b, model: m, variant: v, qty: q, price: p, total: q*p });
                    app.render();
                },
                delQ: (i) => { app.data.queue.splice(i, 1); app.render(); },
                save: () => {
                    const d = app.data.trackerDate;
                    const ent = app.data.sales[d] || { models: '' };
                    let log = "";
                    
                    app.data.queue.forEach(i => {
                        const k = i.brand;
                        ent[k] = (ent[k] || 0) + i.qty;
                        ent[k+'Val'] = (ent[k+'Val'] || 0) + i.total;
                        log += `[${d} ${new Date().toLocaleTimeString()}] ${i.brand} ${i.model} ${i.variant ? '('+i.variant+') ' : ''}- ${i.qty}u (Val: ${i.total})\n`;
                    });
                    
                    ent.models = (ent.models || "") + log;
                    app.data.sales[d] = ent;
                    app.data.queue = [];
                    localStorage.setItem('sec_sales_v1', JSON.stringify(app.data.sales));
                    app.render();
                    alert("Saved successfully!");
                },
                clearToday: () => {
                   if(confirm("Are you sure you want to clear the selected date's data?")) {
                       const d = app.data.trackerDate;
                       delete app.data.sales[d];
                       localStorage.setItem('sec_sales_v1', JSON.stringify(app.data.sales));
                       app.render();
                   }

                dateChange: (d) => { app.data.trackerDate = d; app.render(); },
                getStats: () => {
                    const d = new Date().toISOString().slice(0, 7); // MTD (Current real month)
                    const today = app.data.trackerDate;
                    const ftdData = app.data.sales[today] || {};
                    
                    let ftd = { vol:0, val:0, samVol:0, samVal:0, data: ftdData };
                    let mtd = { vol:0, val:0, samVol:0, samVal:0, breakdownVol:{}, breakdownVal:{} };
                    app.tracker.brands.forEach(b => { mtd.breakdownVol[b.k]=0; mtd.breakdownVal[b.k]=0; });
                    
                    // FTD Calc
                    app.tracker.brands.forEach(b => {
                         const v = ftdData[b.k]||0; const va = ftdData[b.k+'Val']||0;
                         ftd.vol += v; ftd.val += va;
                         if(b.k==='samsung') { ftd.samVol += v; ftd.samVal += va; }
                    });

                    // MTD Calc
                    Object.keys(app.data.sales).forEach(k => {
                        if(k.startsWith(d)) {
                            app.tracker.brands.forEach(b => {
                                const v = app.data.sales[k][b.k]||0; const va = app.data.sales[k][b.k+'Val']||0;
                                mtd.vol += v; mtd.val += va;
                                mtd.breakdownVol[b.k] += v; mtd.breakdownVal[b.k] += va;
                                if(b.k==='samsung') { mtd.samVol += v; mtd.samVal += va; }
                            });
                        }
                    });
                    
                    ftd.samShareVol = ftd.vol ? ((ftd.samVol/ftd.vol)*100).toFixed(1) : 0;
                    ftd.samShareVal = ftd.val ? ((ftd.samVal/ftd.val)*100).toFixed(1) : 0;
                    mtd.samShareVol = mtd.vol ? ((mtd.samVol/mtd.vol)*100).toFixed(1) : 0;
                    mtd.samShareVal = mtd.val ? ((mtd.samVal/mtd.val)*100).toFixed(1) : 0;
                    
                    return { ftd, mtd };
                },

                    const ctx = document.getElementById('volChart');
                    if(!ctx) return;
                    const stats = app.tracker.getStats().mtd.breakdownVol;
                    new Chart(ctx, {

                        data: {

                export: (type) => {
                    // Columns: Date, Variant, Samsung Qty, Samsung Val, ... Others ..., Total Qty, Total Val, Logs
                    const head = ["Date", "Variant"];
                    app.tracker.brands.forEach(b => { head.push(b.l + " Qty"); head.push(b.l + " Val"); });
                    head.push("Total Qty", "Total Val", "Logs");

                    const rows = [head];
                    Object.entries(app.data.sales).sort().forEach(([d, v]) => {
                        const r = [d, ""]; // Variant column empty for aggregated daily rows, or we could parse logs? For now empty.
                        let tQ=0, tV=0;
                        app.tracker.brands.forEach(b => {
                            const q = v[b.k]||0; const val = v[b.k+'Val']||0;
                            r.push(q); r.push(val);
                            tQ+=q; tV+=val;
                        });
                        r.push(tQ, tV, v.models||"");
                        rows.push(r);
                    });

                    if(type === 'xlsx') {
                        const wb = XLSX.utils.book_new();
                        const ws = XLSX.utils.aoa_to_sheet(rows);
                        // Styling columns width
                        ws['!cols'] = [{wch:12}, ...app.tracker.brands.map(_=>[{wch:6},{wch:8}]).flat(), {wch:8}, {wch:10}, {wch:50}];
                        XLSX.utils.book_append_sheet(wb, ws, "Sales Report");
                        const blob = new Blob([XLSX.write(wb, {bookType:'xlsx', type:'array'})], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
                        app.shareOrDownload(blob, "SEC_Sales_Report.xlsx");
                    } else {
                        const doc = new jspdf.jsPDF('l'); // landscape
                        doc.text("Sales Report", 14, 15);
                        doc.autoTable({ head: [rows[0]], body: rows.slice(1), startY: 20, styles: { fontSize: 6, cellPadding: 1 } });
                        const blob = doc.output('blob');
                        app.shareOrDownload(blob, "SEC_Sales_Report.pdf");
                    }
                },
                import: (inp) => {
                    const f = inp.files[0];
                    if(!f) return;
                    
                    // UX Feedback
                    const label = inp.parentElement;
                    const origText = label.innerHTML;
                    label.innerHTML = '<i data-lucide="loader-2" class="animate-spin"></i> Processing...';
                    lucide.createIcons();

                    const r = new FileReader();
                    r.onload = (e) => {
                        try {
                            const wb = XLSX.read(e.target.result, {type:'binary'});
                            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1});
                            // Basic logic to find headers
                            const hIdx = rows.findIndex(r => r.map(c=>String(c).toLowerCase()).includes('date'));
                            if(hIdx < 0) {
                                label.innerHTML = origText; lucide.createIcons();
                                return alert("Invalid Format: Could not find 'Date' column. Please download the template.");
                            }
                            
                            const head = rows[hIdx].map(c=>String(c).toLowerCase().trim());
                            let count = 0;
                            
                            for(let i=hIdx+1; i<rows.length; i++) {
                                const row = rows[i];
                                if(!row[0]) continue;
                                const d = row[head.indexOf('date')]; 
                                if(!d) continue;
                                
                                // Simple Date check/fix (if Excel number)
                                let dateStr = d;
                                if(typeof d === 'number') dateStr = new Date(Math.round((d - 25569)*86400*1000)).toISOString().split('T')[0];
                                
                                const ent = { models: row[head.indexOf('logs')]||"" };
                                app.tracker.brands.forEach(b => {
                                    const qIdx = head.indexOf(b.l.toLowerCase() + " qty");
                                    const vIdx = head.indexOf(b.l.toLowerCase() + " val");
                                    if(qIdx > -1) ent[b.k] = parseInt(row[qIdx])||0;
                                    if(vIdx > -1) ent[b.k+'Val'] = parseInt(row[vIdx])||0;
                                });
                                app.data.sales[dateStr] = ent;
                                count++;
                            }
                            localStorage.setItem('sec_sales_v1', JSON.stringify(app.data.sales));
                            label.innerHTML = origText; lucide.createIcons();
                            app.render();
                            alert(`Restored ${count} records successfully!`);
                        } catch(e) { 
                            label.innerHTML = origText; lucide.createIcons();
                            alert("Error importing file. Please ensure it is a valid Excel file."); 
                            console.error(e); 
                        }
                    };
                    r.readAsBinaryString(f);
                },
                downloadTemplate: () => {
                    const head = ["Date", "Variant"];
                    app.tracker.brands.forEach(b => { head.push(b.l + " Qty"); head.push(b.l + " Val"); });

                    const wb = XLSX.utils.book_new();
                    const ws = XLSX.utils.aoa_to_sheet([head, example]);
                    XLSX.utils.book_append_sheet(wb, ws, "Template");
                    const blob = new Blob([XLSX.write(wb, {bookType:'xlsx', type:'array'})], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
                    app.shareOrDownload(blob, "Import_Template.xlsx");
                }

                                <div class="text-[10px] font-bold text-slate-400 uppercase">Total Payout</div>
                                <div class="text-2xl font-bold text-indigo-600 dark:text-indigo-400">₹${Math.floor(r.grand).toLocaleString()}</div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="app.incentive.export('xlsx')" class="bg-emerald-600 text-white p-2 rounded-xl"><i data-lucide="file-spreadsheet"></i></button>
                                <button onclick="app.incentive.export('pdf')" class="bg-red-600 text-white p-2 rounded-xl"><i data-lucide="file-text"></i></button>
                            </div>
                        </div>
                    `;
                    el.innerHTML = html;
                    lucide.createIcons();
                },
                sec: (col, tit, key, rows, opts, fm=false, focus=[]) => {
                    const colors = { blue: 'border-l-blue-600', green: 'border-l-green-600', purple: 'border-l-purple-600', red: 'border-l-red-600', gray: 'border-l-slate-600' };
                    return `
                        <div class="bg-white dark:bg-slate-800 rounded-xl border-l-4 ${colors[col]} shadow-sm overflow-hidden">
                            <div class="px-3 py-2 bg-${col}-50 dark:bg-${col}-900/10 flex justify-between items-center">
                                <span class="font-bold text-sm dark:text-white">${tit}</span>
                                <button onclick="app.incentive.addRow('${key}')" class="text-xs bg-white dark:bg-slate-700 px-2 py-1 rounded shadow-sm hover:bg-slate-50">+ Add</button>
                            </div>
                            <div class="p-3 space-y-2">
                                ${rows.map((r,i) => `
                                    <div class="flex gap-2">
                                        <select onchange="app.incentive.updRow('${key}',${i},'rate',this.value)" class="flex-1 text-xs p-2 rounded border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 dark:text-white">
                                            ${focus.length ? `<optgroup label="Focus">${focus.map(f=>`<option value="${f.rate}" ${r.rate==f.rate?'selected':''}>${f.name} (${f.rate})</option>`).join('')}</optgroup>` : ''}
                                            ${opts.length ? `<optgroup label="Standard">${opts.map(o=>`<option value="${o.rate}" ${r.rate==o.rate?'selected':''}>${o.label||o.name} (${o.rate})</option>`).join('')}</optgroup>` : ''}
                                        </select>
                                        <input type="number" value="${r.qty||1}" oninput="app.incentive.updRow('${key}',${i},'qty',this.value)" class="w-14 text-center text-xs p-2 rounded border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 dark:text-white">
                                        ${fm ? `<div class="flex items-center px-2 bg-slate-50 dark:bg-slate-900 border rounded"><input type="checkbox" ${r.fm?'checked':''} onchange="app.incentive.updRow('${key}',${i},'fm',this.checked)"><span class="text-[10px] ml-1 font-bold">FM</span></div>` : ''}
                                        <button onclick="app.incentive.delRow('${key}',${i})" class="text-red-400"><i data-lucide="trash-2" width="14"></i></button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                },
                addRow: (k) => { app.data.incRows[k].push({ qty: 1, rate: 0, fm: false }); app.incentive.calc(); app.render(); },
                delRow: (k, i) => { app.data.incRows[k].splice(i, 1); app.incentive.calc(); app.render(); },
                updRow: (k, i, f, v) => { app.data.incRows[k][i][f] = (f=='rate'||f=='qty') ? parseFloat(v) : v; app.incentive.calc(); },
                setMeta: (k, v) => { app.data.incMeta[k] = (k=='channel'||k=='status'||k.startsWith('t_')) ? v : parseFloat(v); app.incentive.calc(); app.render(); },
                bun: (el, r) => { el.dataset.val = (parseInt(el.value)||0) * r; app.incentive.calc(); app.render(); },
                calc: () => {
                    const c = app.data.incConfig; const m = app.data.incMeta; const rows = app.data.incRows; let logs = [];
                    let spQ=0, spRaw=0; rows.sp.forEach(r => { if(r.qty>0) { spQ+=r.qty; spRaw += r.qty * (r.fm ? r.rate*c.sp.fm_mult : r.rate); }});
                    const isExempt = (m.channel == 'sis_pro' || m.status == 'new_joinee'); const gateSet = isExempt ? c.sp.gates.sis : c.sp.gates.std;
                    let gateM = 0, gateN = "Missed Gate"; for(let g of gateSet) { if(spQ >= g.min) { gateM = g.p; gateN = ""; break; } }
                    let spFin = spRaw * gateM; let spPot = spRaw * (gateM > 0 ? gateM : 1.0); const ach = m.target>0 ? spQ/m.target : 0;
                    let missed = false; if(!isExempt && m.channel=='standard' && ach < c.sp.target_thresh) { missed=true; spFin=0; gateN=`Missed Target (${spQ}/${m.target})`; } else if(gateM === 0) { missed=true; gateN=`Missed Volume Gate (${spQ})`; }
                    logs.push({c:"Smartphones", n:gateN, v:spFin, pot:spPot, missed});
                    let tbTot=0; rows.tb.forEach(r => tbTot += (r.qty||0)*r.rate); let tbFin = Math.min(tbTot, c.caps.tb); logs.push({c:"Tablets", n:tbTot>tbFin?"Capped":"", v:tbFin});
                    let wrTot=0; rows.wr.forEach(r => wrTot += (r.qty||0)*r.rate); logs.push({c:"Wearables", n:"", v:wrTot});
                    let comb = spFin + wrTot; if(comb > c.caps.global) { comb = c.caps.global; logs.push({c:"Global Cap", n:"Max 75k applied", v:0}); }
                    let cpTot=0, cpQ=0; rows.cp.forEach(r => { cpQ+=r.qty; cpTot+=(r.qty||0)*r.rate; }); if(cpQ>=8) cpTot*=1.2; if(cpQ>0 && cpQ<3) { cpTot=0; logs.push({c:"Care+", n:"Gate < 3", v:0}); } else { if(m.k_ff7 > 0) cpTot += m.k_ff7 * (m.t_ff7=='high' ? c.cp.kickers.ff7.h : c.cp.kickers.ff7.l); if(m.k_s25 > 0) cpTot += m.k_s25 * (m.t_s25=='high' ? c.cp.kickers.s25.h : c.cp.kickers.s25.l); logs.push({c:"Care+", n:"", v:cpTot}); }
                    let npcTot=0; rows.npc.forEach(r => npcTot += (r.qty||0)*r.rate); let npcFin = Math.min(npcTot, c.caps.npc); logs.push({c:"Note PC", n:npcTot>npcFin?"Capped":"", v:npcFin});
                    let bunTot=0; document.querySelectorAll('input[placeholder="Qty"]').forEach(i => bunTot += (parseInt(i.dataset.val)||0)); if(m.channel!='exclusive') bunTot = Math.min(bunTot, c.caps.bun); logs.push({c:"Bundles", n:"", v:bunTot});
                    let accTot=0; const ab = m.accBase || (spRaw * 25); if(ab > 0 && m.channel!='exclusive') { const pct = (m.accVal/ab)*100; for(let t of c.acc) { if(pct>=t.min) { accTot = t.rate; break; } } } logs.push({c:"Accessories", n:"", v:accTot});
                    let grand = comb + tbFin + npcFin + cpTot + bunTot + accTot;
                    app.data.incResult = { logs, grand, spQ, ach: (ach*100).toFixed(0) };
                    const payEl = document.querySelector('.bottom-16 .text-2xl'); if(payEl) payEl.innerText = `₹${Math.floor(grand).toLocaleString()}`;
                },
                export: (type) => {
                    const r = app.data.incResult; const rows = r.logs.map(l => [l.c, l.n + (l.missed?` (Pot: ${Math.floor(l.pot)})`:''), Math.floor(l.v)]); rows.push(["TOTAL", "", Math.floor(r.grand)]);
                    if(type === 'xlsx') { const wb = XLSX.utils.book_new(); const ws = XLSX.utils.aoa_to_sheet([['Category','Note','Amount'], ...rows]); XLSX.utils.book_append_sheet(wb, ws, "Incentive"); const blob = new Blob([XLSX.write(wb, {bookType:'xlsx', type:'array'})], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}); app.shareOrDownload(blob, 'Incentive_Statement.xlsx'); }
                    else { const doc = new jspdf.jsPDF(); doc.setFontSize(18); doc.text("Incentive Breakdown", 14, 20); doc.autoTable({ startY:30, head:[['Category','Note','Amount']], body:rows }); const blob = doc.output('blob'); app.shareOrDownload(blob, 'Incentive_Statement.pdf'); }
                },
                cfg: () => { const el = document.getElementById('cfg-modal'); el.classList.remove('hidden'); const tabs = ['SP','TB','WR','CP','Misc']; document.getElementById('cfg-tabs').innerHTML = tabs.map(t => `<button onclick="app.incentive.showTab('${t}')" class="px-4 py-2 text-sm font-bold border-b-2 border-transparent hover:border-indigo-600 transition">${t}</button>`).join(''); app.incentive.showTab('SP'); },
                showTab: (t) => {

                        h += `<h4 class="font-bold mb-2 text-sm text-blue-600">Slabs</h4>` + mkT(['Min','Rate'], c.sp.slabs.map((s,i)=>`<tr><td><input class="cfg-input" value="${s.min}" onchange="app.incentive.updCfg('sp.slabs',${i},'min',this.value)"></td><td><input class="cfg-input" value="${s.rate}" onchange="app.incentive.updCfg('sp.slabs',${i},'rate',this.value)"></td></tr>`).join(''));
                        h += `<h4 class="font-bold mt-4 mb-2 text-sm text-blue-600">Gates (Std)</h4>` + mkT(['Min','Mult'], c.sp.gates.std.map((g,i)=>`<tr><td><input class="cfg-input" value="${g.min}" onchange="app.incentive.updCfg('sp.gates.std',${i},'min',this.value)"></td><td><input class="cfg-input" value="${g.p}" onchange="app.incentive.updCfg('sp.gates.std',${i},'p',this.value)"></td></tr>`).join(''));
                        h += `<h4 class="font-bold mt-4 mb-2 text-sm text-blue-600">Gates (SIS)</h4>` + mkT(['Min','Mult'], c.sp.gates.sis.map((g,i)=>`<tr><td><input class="cfg-input" value="${g.min}" onchange="app.incentive.updCfg('sp.gates.sis',${i},'min',this.value)"></td><td><input class="cfg-input" value="${g.p}" onchange="app.incentive.updCfg('sp.gates.sis',${i},'p',this.value)"></td></tr>`).join(''));
                    } 
                    else if (t=='TB') {
                        h += `<h4 class="font-bold mb-2 text-sm text-green-600">Focus Models</h4>` + mkT(['Name','Rate'], c.tb.focus.map((f,i)=>`<tr><td><input class="cfg-input" value="${f.name}" onchange="app.incentive.updCfg('tb.focus',${i},'name',this.value)"></td><td><input class="cfg-input" value="${f.rate}" onchange="app.incentive.updCfg('tb.focus',${i},'rate',this.value)"></td></tr>`).join(''));
                        h += `<h4 class="font-bold mt-4 mb-2 text-sm text-green-600">Slabs</h4>` + mkT(['Min','Rate'], c.tb.slabs.map((s,i)=>`<tr><td><input class="cfg-input" value="${s.min}" onchange="app.incentive.updCfg('tb.slabs',${i},'min',this.value)"></td><td><input class="cfg-input" value="${s.rate}" onchange="app.incentive.updCfg('tb.slabs',${i},'rate',this.value)"></td></tr>`).join(''));
                    }
                    else if (t=='WR') {
                        h += `<h4 class="font-bold mb-2 text-sm text-purple-600">Wearables</h4>` + mkT(['Name','Rate'], c.wr.map((w,i)=>`<tr><td><input class="cfg-input" value="${w.name}" onchange="app.incentive.updCfg('wr',${i},'name',this.value)"></td><td><input class="cfg-input" value="${w.rate}" onchange="app.incentive.updCfg('wr',${i},'rate',this.value)"></td></tr>`).join(''));
                    }
                    else if (t=='CP') {
                        h += `<h4 class="font-bold mb-2 text-sm text-red-600">Care+ Slabs</h4>` + mkT(['Min','Rate'], c.cp.slabs.map((s,i)=>`<tr><td><input class="cfg-input" value="${s.min}" onchange="app.incentive.updCfg('cp.slabs',${i},'min',this.value)"></td><td><input class="cfg-input" value="${s.rate}" onchange="app.incentive.updCfg('cp.slabs',${i},'rate',this.value)"></td></tr>`).join(''));
                        h += `<h4 class="font-bold mt-4 mb-2 text-sm text-red-600">Kickers</h4><div class="grid grid-cols-2 gap-2 text-xs">
                            <div class="bg-red-50 p-2 rounded"><strong>FF7</strong><br>Low: <input class="w-12 border rounded" value="${c.cp.kickers.ff7.l}" onchange="app.incentive.updCfg('cp.kickers.ff7',null,'l',this.value)"> High: <input class="w-12 border rounded" value="${c.cp.kickers.ff7.h}" onchange="app.incentive.updCfg('cp.kickers.ff7',null,'h',this.value)"></div>
                            <div class="bg-red-50 p-2 rounded"><strong>S25</strong><br>Low: <input class="w-12 border rounded" value="${c.cp.kickers.s25.l}" onchange="app.incentive.updCfg('cp.kickers.s25',null,'l',this.value)"> High: <input class="w-12 border rounded" value="${c.cp.kickers.s25.h}" onchange="app.incentive.updCfg('cp.kickers.s25',null,'h',this.value)"></div></div>`;
                    }
                    else if (t=='Misc') {
                        h += `<h4 class="font-bold mb-2 text-sm text-gray-600">Note PC</h4>` + mkT(['Name','Rate'], c.npc.map((n,i)=>`<tr><td><input class="cfg-input" value="${n.name}" onchange="app.incentive.updCfg('npc',${i},'name',this.value)"></td><td><input class="cfg-input" value="${n.rate}" onchange="app.incentive.updCfg('npc',${i},'rate',this.value)"></td></tr>`).join(''));
                        h += `<h4 class="font-bold mt-4 mb-2 text-sm text-gray-600">Caps</h4><div class="grid grid-cols-2 gap-2 text-xs"><div><label>Global</label><input class="cfg-input" value="${c.caps.global}" onchange="app.incentive.updCfg('caps',null,'global',this.value)"></div><div><label>Tablet</label><input class="cfg-input" value="${c.caps.tb}" onchange="app.incentive.updCfg('caps',null,'tb',this.value)"></div><div><label>NPC</label><input class="cfg-input" value="${c.caps.npc}" onchange="app.incentive.updCfg('caps',null,'npc',this.value)"></div><div><label>Bundle</label><input class="cfg-input" value="${c.caps.bun}" onchange="app.incentive.updCfg('caps',null,'bun',this.value)"></div></div>`;
                        h += `<h4 class="font-bold mt-4 mb-2 text-sm text-orange-600">Bundles (Std)</h4>` + mkT(['Name','Rate'], c.bun.std.map((b,i)=>`<tr><td><input class="cfg-input" value="${b.name}" onchange="app.incentive.updCfg('bun.std',${i},'name',this.value)"></td><td><input class="cfg-input" value="${b.rate}" onchange="app.incentive.updCfg('bun.std',${i},'rate',this.value)"></td></tr>`).join(''));
                    }
                    document.getElementById('cfg-content').innerHTML = h;
                },
                updCfg: (path, idx, field, val) => { let obj = app.data.incConfig; path.split('.').forEach((p,i,a) => { if(i==a.length-1) { if(idx!==null) obj[p][idx][field]=parseFloat(val); else obj[p][field]=parseFloat(val); } else obj=obj[p]; }); },

            // --- LOCKER ---
            locker: {

                render: async (el) => {

                                <p class="text-slate-400 text-sm">Secure Local Storage</p>

                                <label class="cursor-pointer flex flex-col items-center gap-3 py-4 text-slate-500 hover:text-indigo-600 transition">

                                    <span class="font-bold text-sm dark:text-white">Upload File</span>
                                </label>
                            </div>
                            <div id="file-list" class="space-y-3"></div>
                        </div>
                    `;
                    app.locker.list();
                },
                addReadme: async () => {
                    const exists = await app.locker.db.getAll('files');
                    if(exists.length === 0) {
                        const blob = new Blob(["Welcome to SEC Unified!\n\nThis locker securely stores your sales evidence, price lists, or schemes.\n\n- Upload images or PDFs.\n- View them directly in the app.\n- Data stays on your device."], {type: 'text/plain'});
                        const reader = new FileReader();
                        reader.onload = async (e) => { await app.locker.db.add('files', { name: "README.txt", type: "text/plain", data: e.target.result, date: new Date().toLocaleDateString() }); if(app.view==='locker') app.locker.list(); };
                        reader.readAsDataURL(blob);

                        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex justify-between items-center">

                toggle: () => { document.getElementById('gemini-overlay').classList.toggle('translate-y-full'); },
                send: async (e) => {
                    e.preventDefault(); const inp = document.getElementById('gemini-input'); const txt = inp.value; if(!txt) return;
                    const chat = document.getElementById('gemini-chat');
                    chat.innerHTML += `<div class="flex gap-2 flex-row-reverse"><div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center shrink-0"><i data-lucide="user" width="16"></i></div><div class="bg-indigo-600 text-white p-3 rounded-2xl rounded-tr-none shadow-sm text-sm">${txt}</div></div>`;

                        setTimeout(() => {
                            const reply = app.gemini.localResp(txt);
                            chat.innerHTML += `<div class="flex gap-2"><div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center shrink-0"><i data-lucide="bot" width="16"></i></div><div class="bg-white dark:bg-slate-800 p-3 rounded-2xl rounded-tl-none shadow-sm text-sm border dark:border-slate-700 dark:text-white">${reply} <br><span class="text-[10px] text-slate-400 mt-2 block">(Offline Mode. Add API Key in settings for full AI)</span></div></div>`;
                            chat.scrollTop = chat.scrollHeight; lucide.createIcons();
                        }, 500); 
                        return;
                    }

                    try {
                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${app.data.geminiKey}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ contents: [{ parts: [{ text: `You are a helper for the SEC Sales App. Only answer regarding sales tracking, incentives, or using this app. User: ${txt}` }] }] }) });
                        const data = await res.json(); const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Error connecting to AI.";
                        chat.innerHTML += `<div class="flex gap-2"><div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center shrink-0"><i data-lucide="bot" width="16"></i></div><div class="bg-white dark:bg-slate-800 p-3 rounded-2xl rounded-tl-none shadow-sm text-sm border dark:border-slate-700 dark:text-white">${reply}</div></div>`;
                        chat.scrollTop = chat.scrollHeight; lucide.createIcons();
                    } catch(e) { chat.innerHTML += `<div class="flex gap-2"><div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center shrink-0"><i data-lucide="bot" width="16"></i></div><div class="bg-white dark:bg-slate-800 p-3 rounded-2xl rounded-tl-none shadow-sm text-sm border dark:border-slate-700 text-red-500">Connection Error</div></div>`; }
                },
                localResp: (q) => {
                    q = q.toLowerCase();
                    if(q.includes('export') || q.includes('excel') || q.includes('pdf')) return "Go to Tracker -> Data tab to export Excel or PDF reports. Incentive reports are at the bottom of the Incentive tab.";
                    if(q.includes('variant') || q.includes('model')) return "Enter the model name (e.g. S25) and variant (e.g. 8/128) in the boxes provided in the Tracker Entry screen.";
                    if(q.includes('incentive') || q.includes('calc')) return "The Incentive tab calculates payout based on 80% rule, SIS gates, and kickers. Configure rates in Dashboard -> Config.";
                    if(q.includes('locker') || q.includes('file')) return "Use the Locker tab to securely store images or PDFs. Files are saved on your device.";
                    if(q.includes('pin') || q.includes('lock') || q.includes('password')) return "You can change your 4-digit PIN in the Profile settings.";
                    return "I am in Offline Mode. I can help with: Exports, Incentive Logic, Locker, and PIN settings. For full AI chat, please add a Gemini API Key in Profile.";
                }
            },
            shareOrDownload: (blob, filename) => {
                const file = new File([blob], filename, { type: blob.type });
                if(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: filename, text: 'Shared from SEC Unified' }).catch(console.error); }
                else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); }
            }
        };

        window.onload = app.init;
    </script>
</body>
</html>
